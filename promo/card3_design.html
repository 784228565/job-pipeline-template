<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:810px; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(150deg,#0d0f22 0%,#101a3a 55%,#181040 100%);
    color:#eef2ff; padding:50px 60px; position:relative; }
  .glow { position:absolute; width:400px; height:400px; border-radius:50%;
    background:#9d6bff; filter:blur(110px); opacity:.35; bottom:-160px; right:-120px; }
  h2 { font-size:44px; font-weight:800; }
  h2 .grad { background:linear-gradient(90deg,#6ea8ff,#b78bff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:8px; font-size:24px; color:#9aa8cf; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:30px; }
  .card { background:rgba(255,255,255,.055); border:1px solid rgba(140,170,255,.22);
    border-radius:20px; padding:26px 26px 24px; }
  .card .k { font-size:26px; font-weight:800; color:#8fd3ff; margin-bottom:12px; }
  .card .v { font-size:21px; color:#b9c4e8; line-height:1.55; }
  .num { font-family:Consolas,monospace; color:#6ea8ff; font-size:22px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <h2>四个<span class="grad">踩过坑</span>的设计决策</h2>
  <p class="sub">不是玩具 Demo，是跑了一个月的真实管道抽象出来的</p>
  <div class="grid">
    <div class="card"><div class="k"><span class="num">01</span> 文件契约解耦</div>
      <div class="v">五个环节只通过文件通信，失败模式互不影响；每个契约带版本号与时效校验。</div></div>
    <div class="card"><div class="k"><span class="num">02</span> 画像 IR + 哈希锚点</div>
      <div class="v">简历信息只存一份 JSON；SHA256 变了才重建，杜绝"换了简历还在用旧画像"。</div></div>
    <div class="card"><div class="k"><span class="num">03</span> 闸门先于评分</div>
      <div class="v">学历/签证/届次等硬性条件先过滤、剔除必留痕；通过的才进入打分排序。</div></div>
    <div class="card"><div class="k"><span class="num">04</span> 全参数化</div>
      <div class="v">姓名、邮箱、路径、登录检测正则全部是占位符——换个人用，不用碰 prompt。</div></div>
  </div>
</body>
</html>
